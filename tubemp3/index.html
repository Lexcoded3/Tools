<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUBEMP3 — Audio Liberator Terminal</title>
<meta name="description" content="TUBEMP3: liberate the audio track from a YouTube link inside a hacker terminal. MP3 at your choice of quality — 100% server-side, no uploads of your link beyond what's needed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
</head>
<body data-theme="green">

<div class="crt-bezel">
    <div class="crt-screen" id="screen">
        <!-- title bar -->
        <div class="titlebar">
            <span class="tb-dots"><i></i><i></i><i></i></span>
            <span class="tb-title">root@tubehax: ~/audio — TUBEMP3 v1.0</span>
            <span class="tb-actions">
                <button type="button" id="btnAcquire" title="Paste a YouTube link to liberate">⏏ ACQUIRE</button>
                <button type="button" id="btnDemo" title="Load a demo track">◈ DEMO</button>
            </span>
        </div>

        <!-- terminal body -->
        <div class="term" id="term">
            <div class="term-output" id="output" tabindex="0" aria-live="polite"></div>
            <div class="term-prompt-row">
                <span class="prompt-label" id="promptLabel">root@tubehax:~$</span>
                <input type="text" id="cmd" class="cmd-input" autocomplete="off" spellcheck="false" aria-label="Terminal command">
            </div>
        </div>

        <!-- status bar -->
        <div class="statusbar" id="statusbar">
            <span id="stEngine">ENGINE: --</span>
            <span id="stJobs">jobs: --</span>
            <span id="stFiles">files: --</span>
            <span id="stSsl">SSL: SECURE</span>
            <span id="stClock">--:--:--</span>
        </div>
    </div>
</div>

<!-- acquisition overlay -->
<div class="dropzone" id="dropzone">
    <div class="dz-inner">
        <div class="dz-banner" id="dzBanner"></div>
        <p class="dz-title">PIPE IN A YOUTUBE TARGET</p>
        <p class="dz-sub">paste a link · MP3 64/128/192/320 kbps · server-side, terminal-grade</p>
        <div class="dz-input-row">
            <span class="dz-prompt">pipe&gt;</span>
            <input type="text" id="dzUrl" class="dz-input" autocomplete="off" spellcheck="false" placeholder="https://www.youtube.com/watch?v=...">
        </div>
        <div class="dz-actions">
            <button type="button" id="dzGo" class="btn">▶ LIBERATE</button>
            <button type="button" id="dzPaste" class="btn btn-ghost">⧉ PASTE</button>
            <button type="button" id="dzDemo" class="btn btn-ghost">◈ DEMO TRACK</button>
        </div>
        <div class="dz-err" id="dzErr"></div>
    </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
